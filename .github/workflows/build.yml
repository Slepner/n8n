# Builds and pushes n8n Docker image to GHCR from forked repo
# Trigger: push to master + version tags (v*) + manual dispatch
# Target: ghcr.io/slepner/n8n:latest and ghcr.io/slepner/n8n:<tag>
#
# FIX (2026-08-03, t_f4cb3104): previous runs 1-3 failed because
#  (a) `pnpm install --ignore-scripts` skipped sqlite3's native build, crashing
#      @n8n/n8n-nodes-langchain#build:unchecked (copy-nodes-json.js requires sqlite3)
#  (b) the workflow never produced ./compiled, which docker/images/n8n/Dockerfile
#      `COPY ./compiled` requires (only scripts/build-n8n.mjs assembles it).
# Now: plain `pnpm install --frozen-lockfile` (pnpm.onlyBuiltDependencies builds
# sqlite3/isolated-vm/@vscode/ripgrep) + `node scripts/build-n8n.mjs` which does
# install -> build:unchecked -> prune -> ./compiled, mirroring upstream CI.

name: 'Build and Push n8n to GHCR'

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

env:
  NODE_VERSION: '24.18.0'
  NODE_OPTIONS: '--max-old-space-size=7168'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # version auto-detected from package.json's packageManager field

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile

      - name: Build n8n and prepare compiled deployment
        run: |
          node scripts/build-n8n.mjs

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/images/n8n/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            N8N_VERSION=${{ github.ref_name }}
            N8N_RELEASE_TYPE=dev
